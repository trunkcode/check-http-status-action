name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: The step that uses the action, and a public URL that shows the problem if you can share one.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Action version
      placeholder: "v2.1.0"
    validations:
      required: true
  - type: input
    id: event
    attributes:
      label: Trigger
      placeholder: "push, pull_request, deployment_status (Netlify)…"
